info:
  name: Obtener Estadísticas Filtradas de Reportes
  type: http
  seq: 100

http:
  method: GET
  url: http://localhost:8080/api/reports/stats?startDate={{startDate}}&endDate={{endDate}}&status={{status}}&barrioId=1
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{JWT_ADMIN}}
  params:
    - name: startDate
      value: "{{startDate}}"
      type: query
    - name: endDate
      value: "{{endDate}}"
      type: query
    - name: status
      value: "{{status}}"
      type: query
    - name: barrioId
      value: "1"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Estadísticas generales (sin filtros opcionales)
    request:
      url: http://localhost:8080/api/reports/stats?startDate=2026-01-01&endDate=2026-04-24
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{JWT_ADMIN}}
  - name: Estadísticas filtradas por estado y barrio
    request:
      url: http://localhost:8080/api/reports/stats?startDate=2026-01-01&endDate=2026-04-24&status=pendiente&barrioId=3
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{JWT_ADMIN}}
