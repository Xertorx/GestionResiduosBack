info:
  name: Obtener Barrios por Distrito
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8080/api/geography/neighborhoods?districtId=1
  headers:
    - name: Accept
      value: application/json
  params:
    - name: districtId
      value: "1"
      type: query
  auth:
    type: bearer
    token: "{{JWT}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
