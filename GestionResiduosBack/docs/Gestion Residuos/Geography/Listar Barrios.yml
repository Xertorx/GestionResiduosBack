info:
  name: Listar Barrios
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8080/api/geography/neighborhoods?districtId={{districtId}}
  headers:
    - name: Accept
      value: application/json
  description: |
    Lista barrios (neighborhoods). Si no se pasa districtId devuelve todos.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

