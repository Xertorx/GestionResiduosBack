spring.aplication.name=GestionResiduosBackend

# Agregar la configuración de la base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de CORS
cors.allowed-origins=*
cors.allowed-methods=GET, POST, PUT, DELETE, OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Configuración de seguridad
security.jwt.secret=${JWT_SECRET:supersecretkeysupersecretkeysupersecretkey1234}
security.jwt.expiration=7200000
security.jwt.refresh-token.expiration=86400000

# Configuración de logging
logging.level.root=INFO
logging.level.com.yourpackage=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Configuración de Swagger

# Disable Spring Boot Docker Compose integration when no docker-compose.yml is present
spring.docker.compose.enabled=false
