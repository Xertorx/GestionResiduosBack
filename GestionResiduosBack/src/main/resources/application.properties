spring:
    aplication:
        name: GestionResiduosBackend

# Agregar la configuración de la base de datos
spring:
    datasource:
        url: {{DB_URL}}
        username: {{DB_USER}}
        password: {{DB_PASSWORD}}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.postgreSQLDialect
        show-sql: true
# Configuración de CORS
cors:
    allowed-origins: "*"
    allowed-methods: GET, POST, PUT, DELETE, OPTIONS
    allowed-headers: "*"
    allow-credentials: true
# Configuración de seguridad
security:
    jwt:
        secret: {{JWT_SECRET}}
        expiration: 7200000 # 2 hora en milisegundos    
        refresh-token:
            expiration: 86400000 # 24 horas en milisegundos
# Configuración de logging           
logging:
    level:
        root: INFO
        com.yourpackage: DEBUG      org.springframework: WARN     org.hibernate: WARN
# Configuración de Swagger