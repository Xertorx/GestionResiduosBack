# Base de datos H2 en memoria para pruebas
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT config para pruebas (nombres reales usados por JwtService)
security.jwt.secret=testsecretkeytestsecretkeytestsecretkey1234567890abcdef
security.jwt.expiration=3600000
security.jwt.refresh-token.expiration=86400000

# Aliases para compatibilidad con tests @WebMvcTest
jwt.secret=testsecretkeytestsecretkeytestsecretkey1234567890abcdef
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# Email (deshabilitado en pruebas)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Logging
logging.level.root=WARN
logging.level.com.co.ucentral=ERROR

# Uploads
upload.path=./test-uploads

# SQL init para pruebas de contexto completo
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-test.sql
spring.jpa.defer-datasource-initialization=true

